# Agent preset ptc reuses Standard and applies only the PTC presentation changes.
- insert:
    - id: preset-ptc
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ptc
        order: 6
        plugins:
          - id: ptc-composition
            name: cordis:include
            config:
              path: compositions/standard.yml
              patches:
                - id: workflow-ptc
                  disabled: true
                - id: tool-workflow
                  disabled: true
                - id: tool-presentation
                  disabled: false
                  config:
                    mode: ptc
