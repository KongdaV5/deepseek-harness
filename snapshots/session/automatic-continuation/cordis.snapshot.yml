# Replay-only twin of the owner composition, using the committed model script.
- insert:
    - id: task-checkpoint
      name: '@deepseek-ai/dsh-task-checkpoint'
      config:
        maxAutoContinuations: 1
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true
